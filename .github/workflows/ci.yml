name: DataFlow CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-format:
    name: Lint & Code Style Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Lint Checks
        run: ruff check .

      - name: Run Ruff Formatting Verification
        run: ruff format --check .

  test-suite:
    name: Automated Test Suite & Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_ci_password
          POSTGRES_DB: dataflow_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run Pytest Suite with Coverage
        env:
          ENVIRONMENT: test
          SECRET_KEY: ci-secure-token-secret-key-at-least-32-chars-long
          DATABASE_URL: postgresql+asyncpg://postgres:postgres_ci_password@localhost:5432/dataflow_test_db
          DATABASE_SYNC_URL: postgresql+psycopg://postgres:postgres_ci_password@localhost:5432/dataflow_test_db
          REDIS_URL: redis://localhost:6379/0
          RATE_LIMIT_ENABLED: "false"
        run: |
          pytest -v --cov=app --cov-report=xml --cov-report=term-missing

  docker-build:
    name: Docker Image Build Verification
    runs-on: ubuntu-latest
    needs: [lint-and-format, test-suite]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: dataflow:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
