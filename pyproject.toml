[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dataflow"
version = "1.0.0"
description = "Production-Grade Backend API and Data Processing System"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "DataFlow Core Team" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "psycopg[binary]>=3.2.3",
    "asyncpg>=0.30.0",
    "redis>=5.1.0",
    "celery>=5.4.0",
    "pyjwt[crypto]>=2.9.0",
    "argon2-cffi>=23.1.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.2",
    "prometheus-client>=0.21.0",
    "python-json-logger>=2.0.7",
    "python-multipart>=0.0.12",
    "email-validator>=2.2.0",
    "aiosqlite>=0.20.0",
    "greenlet>=3.1.1",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "api*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "locust>=2.31.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "C4", "UP"]
ignore = ["E501", "E402", "B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
